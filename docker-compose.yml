services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalOnlySa1}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  db-init:            # one-off: creates DBs and logins, then exits
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver: { condition: service_healthy }
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -b
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - ${MSSQL_SA_PASSWORD:-LocalOnlySa1}
      - -i
      - /init.sql
      - -v
      - CATALOG_DB_PASSWORD=${CATALOG_DB_PASSWORD:-LocalCatalog1}
      - MATCHES_DB_PASSWORD=${MATCHES_DB_PASSWORD:-LocalMatches1}
    restart: "no"

  catalog:
    build: ./services/catalog
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: mssql+pymssql://catalog_app:${CATALOG_DB_PASSWORD:-LocalCatalog1}@sqlserver:1433/catalog
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8001:8000"

  matches:
    build: ./services/matches
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: mssql+pymssql://matches_app:${MATCHES_DB_PASSWORD:-LocalMatches1}@sqlserver:1433/matches
      CATALOG_URL: http://catalog:8000
      CATALOG_TIMEOUT_S: "20"
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8002:8000"

  ui-build:           # one-off: builds ui/ into ui/dist, then exits
    image: node:22-alpine
    working_dir: /ui
    volumes:
      - ./ui:/ui
      - /ui/node_modules   # keeps Linux node_modules out of your Mac's ui/node_modules
    command: sh -c "npm ci && npm run build"

  ui:
    image: nginx:alpine
    depends_on:
      ui-build: { condition: service_completed_successfully }
    volumes:
      - ./ui/dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  mssql-data: